name: Coletar na nuvem e publicar (teste manual)
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Teste de acesso ao site da Câmara
        run: |
          curl -sS -o /dev/null -m 30 -w "HTTP %{http_code} em %{time_total}s\n" https://camarasempapel.camarasjc.sp.gov.br/ || { echo "O site da Câmara não respondeu a este servidor do GitHub."; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Coletar (aborta sem publicar se algo estiver incompleto)
        run: python3 coletor/atualizar.py
      - run: python3 coletor/gerar_site.py
      - name: Guardar dados novos no repositório
        run: |
          git config user.name "robo-radar"
          git config user.email "robo-radar@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
