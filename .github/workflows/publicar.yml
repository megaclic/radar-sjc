name: Publicar site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versao dos arquivos (evita cache antigo)
        run: sed -i "s/v=dev/v=${GITHUB_SHA::8}/g; s/window.V='dev'/window.V='${GITHUB_SHA::8}'/" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
